name: Docs checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # Mondays: catches external links that broke since the last change
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content:
    name: Links, wording and placeholders
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check README, SECURITY, docs and papers
        run: |
          papers=$(ls papers/*.md | xargs -n1 basename | sed 's/\.md$//' | grep -vx README)
          python3 .github/scripts/check-public.py . $papers

  markdown:
    name: Markdown style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          config: .github/docs.markdownlint.jsonc
          globs: |
            README.md
            SECURITY.md
            docs/*.md

  external-links:
    name: External links
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --max-retries 3
            --accept 200,206,429
            --exclude 'github\.com/Seven-Fortunas/7fchain/security/advisories/new'
            --exclude 'youtube\.com/results'
            --exclude-loopback
            README.md SECURITY.md 'docs/*.md' 'papers/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Open an issue when the weekly run finds broken links
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --label documentation \
            --title "Broken links found by the weekly docs check" \
            --body "The weekly link check failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
